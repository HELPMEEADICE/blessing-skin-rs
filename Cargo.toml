[package]
name = "blessing-skin-rs"
version = "0.1.0"
edition = "2024"
description = "Rust implementation of Blessing Skin Server"
license = "MIT"

[dependencies]
askama = "0.16"
ammonia = "4"
pulldown-cmark = "0.13"
rand = "0.8.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
httpdate = "1"
form_urlencoded = "1"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
argon2 = "0.5"
bcrypt = "0.19"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
