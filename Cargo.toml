[package]
name = "blessing-skin-rs"
version = "0.1.0"
edition = "2024"
description = "Rust implementation of Blessing Skin Server"
license = "MIT"

[dependencies]
askama = "0.16"
base64 = "0.22"
ammonia = "4"
pulldown-cmark = "0.13"
pbkdf2 = "0.12"
rand = "0.8.8"
regex = "1"
rsa = { version = "0.9", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ctr = "0.9"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
httpdate = "1"
form_urlencoded = "1"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
argon2 = "0.5"
aes = "0.8"
bcrypt = "0.19"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "macros"] }
thiserror = "2"
wasmtime = { version = "49.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "wat"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
fancy-regex = "0.19.2"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
