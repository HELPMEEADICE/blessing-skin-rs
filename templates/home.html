<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }}</title>
  <style>body{font:16px system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#343a40}main{background:white;padding:2rem;border-radius:8px;box-shadow:0 8px 28px #0002;text-align:center}a{display:inline-block;background:#007bff;color:white;text-decoration:none;border-radius:4px;padding:.7rem 1.2rem}</style>
  {% if frontend_style_available %}<link rel="stylesheet" href="{{ frontend_stylesheet }}" crossorigin="anonymous">{% endif %}
  {% if frontend_script_available %}<script>window.blessing=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('{{ frontend_globals_b64 }}'), character => character.charCodeAt(0))));</script>{% endif %}
</head>
<body><main id="home-app"><h1>{{ site_name }}</h1><p>{{ title }}</p><a href="/auth/login">{{ login }}</a> <a href="/skinlib">{% if locale.starts_with("zh") %}浏览皮肤库{% else %}Browse skin library{% endif %}</a></main>
  {% if frontend_script_available %}<script src="{{ frontend_script }}" crossorigin="anonymous"></script>{% endif %}
</body>
</html>
