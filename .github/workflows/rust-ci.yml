name: Rust CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  compat-probe:
    name: Read-only compatibility probe tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test safe request allowlist and response comparison
        run: python -m unittest tools.test_compat_compare

  legacy-db-compat:
    name: Legacy MySQL, MariaDB, and PostgreSQL table compatibility
    runs-on: ubuntu-24.04
    env:
      BS_REQUIRE_DATABASE_COMPAT: '1'
      BS_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/blessing_skin_test
      BS_TEST_MARIADB_URL: mysql://root:root@127.0.0.1:3307/blessing_skin_test
      BS_TEST_POSTGRES_URL: postgres://postgres:root@127.0.0.1:5432/blessing_skin_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blessing_skin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: blessing_skin_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: blessing_skin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blessing_skin_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify old schema reads and writes on MySQL, MariaDB, and PostgreSQL
        run: cargo test --locked legacy_database_compatibility -- --test-threads=1
  plugin-scaffold:
    name: Build generated WASM plugin scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Generate scaffold from a legacy plugin fixture
        run: >-
          cargo run --locked --bin plugin-migrate --
          tests/__mocks__/fake-with-views
          --output "${{ runner.temp }}/plugin-scaffold"
      - name: Build generated component
        working-directory: ${{ runner.temp }}/plugin-scaffold
        run: cargo component build --release

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test Linux and macOS binary startup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          database="$RUNNER_TEMP/blessing-skin-smoke.sqlite"
          log="$RUNNER_TEMP/blessing-skin-smoke.log"
          : > "$database"
          BS_LISTEN="127.0.0.1:$port" DB_CONNECTION=sqlite DB_DATABASE="$database" \
            "target/${{ matrix.target }}/release/blessing-skin-rs" >"$log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/health/ready" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.25
          done
          cat "$log"
          echo "Rust service did not become ready within 30 seconds."
          exit 1
      - name: Smoke test Windows binary startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $database = Join-Path $env:RUNNER_TEMP "blessing-skin-smoke.sqlite"
          [System.IO.File]::WriteAllBytes($database, [byte[]]::new(0))
          $env:BS_LISTEN = "127.0.0.1:$port"
          $env:DB_CONNECTION = "sqlite"
          $env:DB_DATABASE = $database
          $stdout = Join-Path $env:RUNNER_TEMP "blessing-skin-smoke.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "blessing-skin-smoke.err.log"
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release/blessing-skin-rs.exe"
          $process = Start-Process -FilePath $binary -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            while ($stopwatch.Elapsed.TotalSeconds -lt 30) {
              if ($process.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "Rust service exited with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health/ready" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Rust service did not become ready within 30 seconds."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }
